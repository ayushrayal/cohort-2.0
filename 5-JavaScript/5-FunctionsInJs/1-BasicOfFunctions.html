<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic of Functions</title>
        <script>
        // Function Declaration
        function greeting() {
            console.log("Heyy ayush rayal")
        }
        // Calling the function
        greeting();

        // Function Expression
        const greet = () => {
            console.log("Hello Ayush Rayal")
        }
        // Calling the function
        greet();

        // Function with Parameters
        function add(a, b) {
            return a + b;
        }
        // Calling the function
        console.log(add(5, 3));

        // Function with Default Parameters
        function multiply(a, b = 2) {
            return a * b;
        }
        // Calling the function
        console.log(multiply(5));
    </script>
</head>
<body>

</body>
</html>
