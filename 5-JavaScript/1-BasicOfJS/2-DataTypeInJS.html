<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Type in JavaScript</title>
</head>
<body>
    <script>
        // String Data Type
        let name = "John Doe";
        console.log("Name:", name);
        console.log("Type of Name:", typeof name);

        // Number Data Type
        let age = 30;
        console.log("Age:", age);
        console.log("Type of Age:", typeof age);

        // Boolean Data Type
        let isStudent = false;
        console.log("Is Student:", isStudent);
        console.log("Type of Is Student:", typeof isStudent);

        // Undefined Data Type
        let address;
        console.log("Address:", address);
        console.log("Type of Address:", typeof address);

        // Null Data Type
        let phoneNumber = null;
        console.log("Phone Number:", phoneNumber);
        console.log("Type of Phone Number:", typeof phoneNumber);

        // BigInt Data Type
        let bigIntValue = 1234567890123456789012345678901234567890n;
        console.log("BigInt Value:", bigIntValue);
        console.log("Type of BigInt Value:", typeof bigIntValue);

        // Symbol Data Type
        let sym = Symbol("uniqueIdentifier");
        console.log("Symbol:", sym);
        console.log("Type of Symbol:", typeof sym);

        // Object Data Type
        let person = {
            firstName: "Jane",
            lastName: "Doe",
            age: 25
        };
        console.log("Person:", person);
        console.log("Type of Person:", typeof person);

        // Array Data Type
        let colors = ["Red", "Green", "Blue"];
        console.log("Colors:", colors);
        console.log("Type of Colors:", typeof colors);
    </script>
</body>
</html>
