    <script>
        // Level 1 - Pure Beginner Practice
        // 1. Write a for loop that prints numbers from 1 to 10.
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // 2. Write a for loop that prints even numbers between 1 and 20.
        for(let i=1; i<=20; i++){
            if(i%2 === 0){
                console.log(`Even number between 1 to 20: ${i}`);
            }
        }

        // 3. Write a for loop that prints numbers from 10 to 1 in descending order.
        for(let i = 10; i>0; i--){
            console.log(i);
        }

        // 4. Print the word ""Yess!"" five times using a for loop.
        for(let i = 0; i<=5; i++){
            console.log("Yess!");
        }

        // 5. Print whether numbers from 1 to 10 are even or odd.
        for(let i = 1; i<=10; i++){
            if(i%2 === 0){
                console.log(`${i} is Even`);
            } else {
                console.log(`${i} is Odd`);
            }
        }

        let num = parseInt(prompt("Enter a number to check positive and negative: "));
        if(num >= 0){
            console.log(`${num} is Positive Number`);
        } else {
            console.log(`${num} is Negative Number`);
        }
        
        let num1 = parseInt(prompt("Enter Start Number: "));
        let num2 = parseInt(prompt("Enter End Number: "));
        if(num1 > num2){
            console.error("Start number should be less than or equal to End number.");
        }
        for(let i = num1; i<=num2; i++){
            console.log(i);
        }
    </script>
