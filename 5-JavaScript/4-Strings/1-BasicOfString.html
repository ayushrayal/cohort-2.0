<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic of String</title>
</head>
<body>
    <script>
        let str = "hello world";
        document.write("String: " + str + "<br>");
        document.write("Length of string: " + str.length + "<br>");
        document.write("Character at index 0: " + str.charAt(0) + "<br>");
        document.write("Substring from index 0 to 5: " + str.substring(0, 5) + "<br>");
        document.write("Index of 'world': " + str.indexOf("world") + "<br>");
        document.write("Uppercase: " + str.toUpperCase() + "<br>");
        document.write("Lowercase: " + str.toLowerCase() + "<br>");
        document.write("Replace 'world' with 'JavaScript': " + str.replace("world", "JavaScript") + "<br>");
        document.write("Split by space: " + str.split(" ") + "<br>");
    </script>
</body>
</html>
