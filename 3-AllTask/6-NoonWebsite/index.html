<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noon</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <img src="/Photos/logo-noon.a824a6ca.png" alt="" />
        <h2>Noon</h2>
        <button><i class="ri-menu-line"></i>Menu</button>
      </nav>
      <section>
        <h1>Noon</h1>
        <h5>The most powerful AI ever deployed in talent acquisition</h5>
        <button>Get Started <i class="ri-arrow-right-line"></i></button>
        <video src="/Photos/line-waves.webm" autoplay muted loop></video>
        <div></div>
      </section>
      <!-- Slider main container -->
      <div class="swiper slider">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide slide">
            <img src="/Photos/logitech.webp" alt="">
            <h1>LogiTech</h1>
            <h3>Kolena Maxwell</h3>
            <p>Head of Talent Acquisiton</p>
          </div>
          <div class="swiper-slide slide">
            <img src="/Photos/metlife.png" alt="">
            <h1>Met Life</h1>
            <h3>Patricia Porter</h3>
            <p>VP, Global Head of Talent</p>
          </div>
          <div class="swiper-slide slide">
            <img src="/Photos/goldman_sachs.webp" alt="">
            <h1>Goldman Sachs</h1>
            <h3>Vicki Tung</h3>
            <p>GlobalHead of Talent Acquisiton</p>
          </div>
          
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- navigation removed: autoplay-only slider -->
        <!-- If we need scrollbar (kept for draggable control) -->
        <div class="swiper-scrollbar"></div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="gsap.js"></script>
  </body>
</html>
