<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweaters</title>
    <link rel="shortcut icon" href="../Photos/model3.jpg" type="image/x-icon">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'GulamsCondensedDemoExtrabold', sans-serif;
            color: #474545;
        }
        html, body{
            height: 100%;
            width: 100%;
        }
        .main{
            height: 100%;
            width: 100%;
            background-color: rgb(252, 252, 239);
        }
        .navbar{
            height: 8%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .navbar a{
            color: #474545;
            text-decoration: none;
            padding: 14px 0;
            font-size: 18px;
            font-weight: 400;
            padding-left: 55px;
        }
        h1{
            position: absolute;
            top: 12%;
            left: 10%;
            margin-top: 20px;
            font-size: 19vw;
            font-weight: 600;
            font-family: 'GulamsCondensedDemoExtrabold', sans-serif;
            color: #1E1E1E;
        }
        #bottom-left{
            position: absolute;
            top: 60%;
            left: 3%;
            color: #474545;
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
        }
        #bottom-left #h4{
            margin-top: 10%;
        }
        #bottom-left h4{
            font-size: 20px;
            margin-bottom: 5px;
            font-weight: 800;
        }
        #bottom{
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 60px;
            align-items: center;
            height: 10%;
        }
        #bottom h4{
            font-size: 30px;
            font-weight: 800;
            color: #474545;
        }
        #bottom a{
            text-decoration: none;
            font-size: 20px;
            color: #474545;
            font-weight: 600;
        }
        img{
            border-radius: 5px;
            position: absolute;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        #mdl1{
            right: 40%;
            height: 300px;
            top: 55%;
        }
        #mdl2{
            right: 29%;
            height: 250px;
            top: 45%;
        }
        #mdl3{
            right: 17%;
            height: 300px;
            top: 53%;
        }


    </style>
</head>
<body>
    <div class="main">
         <div class="navbar">
            <a href="#home">Home</a>
            <a href="#about">Shop</a>
            <a href="#services">Lookbook</a>
            <a href="#portfolio">About</a>
            <a href="#contact">News</a>
            <a href="#blog">Cart</a>
         </div>
         <h1>Sweaters</h1>
         <div id="bottom-left">
            <h4>Products Details</h4>
            <p>Here you can find the details about our sweaters.</p>
            <h4 id="h4">Material</h4>
            <p>100% Cotton</p>
         </div>
         <div id="bottom">
            <h4>New Collection</h4>
            <a href="#">Shop The look -></a>
         </div>
         <img id="mdl1" src="../Photos/model1.jpg" alt="">
         <img id="mdl2" src="../Photos/model2.jpg" alt="">
         <img id="mdl3" src="../Photos/model3.jpg" alt="">
    </div>
</body>
</html>
