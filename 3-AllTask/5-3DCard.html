<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        html, body{
            height: 100%;
            width: 100%;
        }
        .main{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            background-color: #f0f0f0;
            perspective: 1000px;
        }
        .card{
            width: 300px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
        }

        .card img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card img.hover{
            transform: rotateY(180deg);
        }
        
    </style>
</head>
<body>
    <div class="main">
        <div id="card1" class="card">
            <img src="../Photos/girl1.jpg" alt="" class="card-img normal">
            <img src="../Photos/girl2.jpg" alt="" class="card-img hover">
        </div>
        <div id="card2" class="card">
            <img src="../Photos/girl2.jpg" alt="">
        </div>
        <div id="card3" class="card">
            <img src="../Photos/girl3.jpg" alt="">
        </div>
    </div>
</body>
</html>
